<section class="card" id="drive-status">
    <h2 data-lang="en">Drive Status</h2>
    <h2 data-lang="cs">Stav disků</h2>

    <div class="chart-toolbar" id="driveChartToolbar">
        <button type="button" class="chart-range-btn is-active" data-range="6h">6h</button>
        <button type="button" class="chart-range-btn" data-range="12h">12h</button>
        <button type="button" class="chart-range-btn" data-range="1d">1d</button>
        <button type="button" class="chart-range-btn" data-range="7d">7d</button>
        <button type="button" class="chart-range-btn" data-range="all">All</button>
    </div>
    <div class="drive-chart-shell">
        <div id="driveChart" style="width: 100%; height: 420px;"></div>
    </div>
    <p id="driveChartEmpty" class="drive-chart-empty">
        No drive history has been collected yet.
    </p>
</section>
<script>
fetch('/api/drive-status')
.then(response => response.json())
.then(payload => {
    const chartNode = document.getElementById('driveChart');
    const emptyNode = document.getElementById('driveChartEmpty');
    const toolbarNode = document.getElementById('driveChartToolbar');
    const stateLabels = {
        0: 'Standby',
        1: 'Active'
    };
    let activeRange = '6h';

    function getThemeColors() {
        const css = getComputedStyle(document.documentElement);
        return {
            css,
            textColor: css.getPropertyValue('--text').trim(),
            mutedColor: css.getPropertyValue('--muted').trim(),
            accentColor: css.getPropertyValue('--accent').trim(),
            gridColor: css.getPropertyValue('--grid').trim(),
            bgElevated: css.getPropertyValue('--bg-elevated').trim(),
            borderColor: css.getPropertyValue('--border').trim(),
            hoverBgColor: 'rgba(15, 23, 42, 0.54)'
        };
    }

    function buildTraces() {
        const theme = getThemeColors();
        return (payload.series || [])
            .map(series => {
                const points = (series.points || []).filter(point => point.state === 0 || point.state === 1);
                if (!points.length) {
                    return null;
                }

                return {
                    type: 'scatter',
                    mode: 'lines+markers',
                    name: series.label,
                    x: points.map(point => new Date(point.timestamp)),
                    y: points.map(point => point.state),
                    text: points.map(point => stateLabels[point.state]),
                    line: {
                        shape: 'hv',
                        width: 3,
                        color: theme.accentColor
                    },
                    marker: {
                        size: 7,
                        color: theme.accentColor,
                        line: {
                            width: 1.5,
                            color: theme.bgElevated
                        }
                    },
                    hovertemplate: '%{x|%Y-%m-%d %H:%M}<br>%{text}<extra>%{fullData.name}</extra>'
                };
            })
            .filter(Boolean);
    }

    function renderChart() {
        const theme = getThemeColors();
        const traces = buildTraces();

        if (!traces.length) {
            chartNode.style.display = 'none';
            emptyNode.style.display = 'block';
            toolbarNode.style.display = 'none';
            return;
        }

        chartNode.style.display = 'none';
        chartNode.style.display = '';
        emptyNode.style.display = 'none';
        toolbarNode.style.display = '';

        const layout = {
            margin: { t: 24, r: 24, b: 56, l: 72 },
            paper_bgcolor: 'rgba(0, 0, 0, 0)',
            plot_bgcolor: 'rgba(0, 0, 0, 0)',
            font: {
                color: theme.textColor
            },
            hovermode: 'x unified',
            hoverlabel: {
                bgcolor: theme.hoverBgColor,
                bordercolor: theme.accentColor,
                font: {
                    color: theme.textColor
                }
            },
            legend: {
                orientation: 'h',
                yanchor: 'bottom',
                y: 1.02,
                xanchor: 'left',
                x: 0,
                font: {
                    color: theme.textColor
                }
            },
            xaxis: {
                type: 'date',
                title: 'Time',
                showgrid: true,
                gridcolor: theme.gridColor,
                zeroline: false,
                showspikes: true,
                spikecolor: theme.accentColor,
                spikethickness: 1,
                spikesnap: 'cursor',
                tickfont: {
                    color: theme.mutedColor
                },
                titlefont: {
                    color: theme.textColor
                },
                rangeslider: {
                    visible: true,
                    thickness: 0.1,
                    bgcolor: theme.bgElevated,
                    bordercolor: theme.borderColor
                }
            },
            yaxis: {
                title: 'State',
                range: [-0.15, 1.15],
                tickvals: [0, 1],
                ticktext: ['Standby', 'Active'],
                showgrid: true,
                gridcolor: theme.gridColor,
                tickfont: {
                    color: theme.mutedColor
                },
                titlefont: {
                    color: theme.textColor
                },
                zeroline: false
            }
        };

        Plotly.react(chartNode, traces, layout, {
            responsive: true,
            displaylogo: false,
            scrollZoom: true,
            modeBarButtonsToRemove: ['select2d', 'lasso2d', 'autoScale2d']
        });

        applyRange(activeRange);
    }

    function getRangeBounds(rangeKey) {
        if (rangeKey === 'all') {
            return null;
        }

        const hoursByKey = {
            '6h': 6,
            '12h': 12,
            '1d': 24,
            '7d': 168
        };
        const hours = hoursByKey[rangeKey] || 6;
        const end = new Date();
        const start = new Date(end.getTime() - (hours * 60 * 60 * 1000));
        return [start, end];
    }

    function applyRange(rangeKey) {
        activeRange = rangeKey;
        const bounds = getRangeBounds(rangeKey);
        if (bounds) {
            Plotly.relayout(chartNode, {
                'xaxis.autorange': false,
                'xaxis.range[0]': bounds[0],
                'xaxis.range[1]': bounds[1]
            });
        } else {
            Plotly.relayout(chartNode, {
                'xaxis.autorange': true
            });
        }

        toolbarNode.querySelectorAll('.chart-range-btn').forEach(button => {
            button.classList.toggle('is-active', button.dataset.range === rangeKey);
        });
    }

    toolbarNode.querySelectorAll('.chart-range-btn').forEach(button => {
        button.addEventListener('click', () => applyRange(button.dataset.range));
    });

    document.addEventListener('nas:themechange', renderChart);

    renderChart();
})
.catch(error => console.error('Error fetching drive status:', error));
</script>

<div class="preferences-bar">
  <div class="toggle-group" aria-label="Theme selector">
    <button class="theme-btn" data-theme-btn="light" type="button" aria-pressed="false">
      <span class="theme-btn-icon theme-btn-icon-sun" aria-hidden="true"></span>
      <span data-lang="en">Light</span>
      <span data-lang="cs">Světlý</span>
    </button>
    <button class="theme-btn" data-theme-btn="dark" type="button" aria-pressed="false">
      <span class="theme-btn-icon theme-btn-icon-moon" aria-hidden="true"></span>
      <span data-lang="en">Dark</span>
      <span data-lang="cs">Tmavý</span>
    </button>
  </div>
  <div class="toggle-group" aria-label="Language selector">
    <button class="lang-btn" data-lang-btn="en" type="button" aria-pressed="false">
      English
    </button>
    <button class="lang-btn is-active" data-lang-btn="cs" type="button" aria-pressed="true">
      Česky
    </button>
  </div>
</div>
